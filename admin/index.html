<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨諾創意｜網站後台管理</title>
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--klein:#002FA7;--klein-light:#EAF0FC;--gold:#B8925A;--ink:#1A1A1A;--mute:#6B6B6B;--line:#EAEAEA;--ok:#1B8A5A;--bad:#C0392B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:#FAFAFA;color:var(--ink);padding:0 0 80px;}
header{background:var(--klein);color:#fff;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
header h1{font-size:18px;font-weight:700;}
header .status{font-size:13px;opacity:0.85;}
.wrap{padding:32px 5vw;max-width:1100px;margin:0 auto;}
.login-box{max-width:440px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:40px;}
.login-box h2{font-size:20px;margin-bottom:12px;}
.login-box p{font-size:14px;color:var(--mute);line-height:1.8;margin-bottom:20px;}
.login-box input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;font-size:14px;margin-bottom:16px;}
.login-box button{width:100%;background:var(--klein);color:#fff;border:none;padding:14px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer;}
.login-box button:hover{background:#001F70;}
.login-box .steps{background:var(--klein-light);border-radius:6px;padding:16px 18px;font-size:13px;line-height:2;margin-bottom:20px;color:#333;}
.login-box .steps b{color:var(--klein);}
.section-block{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:24px;overflow:hidden;}
.section-header{background:var(--klein-light);padding:16px 24px;font-weight:700;font-size:15px;color:var(--klein);}
.item-row{display:grid;grid-template-columns:180px 1fr;gap:24px;padding:24px;border-bottom:1px solid var(--line);align-items:start;}
.item-row:last-child{border-bottom:none;}
.thumb{width:180px;height:110px;border-radius:4px;background:#F0EDE6;position:relative;overflow:hidden;border:1px solid var(--line);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;padding:4px 6px;text-align:center;}
.field-label{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:6px;}
.field-input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;margin-bottom:10px;font-family:inherit;}
textarea.field-input{resize:vertical;min-height:52px;}
.upload-btn{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--klein);color:var(--klein);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;}
.upload-btn:hover{background:var(--klein-light);}
input[type=file]{display:none;}
.recommend{font-size:11.5px;color:var(--mute);margin-top:6px;}
.savebar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:16px 5vw;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,0.06);z-index:60;}
.savebar .msg{font-size:13px;color:var(--mute);}
.save-btn{background:var(--klein);color:#fff;border:none;padding:14px 40px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer;}
.save-btn:hover{background:#001F70;}
.save-btn:disabled{background:#ccc;cursor:not-allowed;}
.toast{position:fixed;top:80px;right:5vw;background:var(--ok);color:#fff;padding:14px 22px;border-radius:6px;font-size:14px;font-weight:500;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,0.15);display:none;}
.toast.bad{background:var(--bad);}
.hidden{display:none!important;}
@media(max-width:700px){.item-row{grid-template-columns:1fr;}.thumb{width:100%;height:160px;}}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>晨諾創意｜網站後台</h2>
  <p>第一次使用，需要先產生一組「授權碼」，之後這台電腦就會記住，不用每次都設定。</p>
  <div class="steps">
    <b>①</b> 打開 GitHub → 右上角頭像 → Settings<br>
    <b>②</b> 左側最下面 Developer settings<br>
    <b>③</b> Personal access tokens → Tokens (classic)<br>
    <b>④</b> Generate new token (classic)<br>
    <b>⑤</b> 勾選 <b>repo</b> 這一項，時間選 90 days 或 No expiration<br>
    <b>⑥</b> 產生後複製那串代碼，貼到下面
  </div>
  <input type="password" id="tokenInput" placeholder="貼上你的授權碼 (ghp_ 開頭)">
  <button onclick="doLogin()">登入後台</button>
</div>

<div id="adminScreen" class="hidden">
  <header>
    <h1>晨諾創意｜網站後台管理</h1>
    <div class="status" id="statusText">已連線</div>
  </header>
  <div class="wrap" id="contentArea"></div>
  <div class="savebar">
    <div class="msg" id="saveMsg">修改完成後，記得按「儲存」才會真的更新到網站上</div>
    <button class="save-btn" id="saveBtn" onclick="saveAll()">💾 儲存並更新網站</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REPO_OWNER = "barbara1266-oss";
const REPO_NAME = "sincerity-design";
const BRANCH = "main";
const API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

let TOKEN = localStorage.getItem('sd_admin_token') || '';
let siteData = null;
let dataSha = null;
let pendingFiles = {};

const SLOTS = [
  { group: "首頁 · Hero 主視覺", key: "hero", img: "1200×1500px", hasTag:true, hasTitle:true },
  { group: "首頁 · 服務網格照片磚（補空白格）", key: "service_grid_photo", img: "800×1000px（直式較佳）", hasTag:true, hasTitle:true },
  { group: "「這些，都是我們陪著走過的路」· 01", key: "work1", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「這些，都是我們陪著走過的路」· 02", key: "work2", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「這些，都是我們陪著走過的路」· 03", key: "work3", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「這些，都是我們陪著走過的路」· 04", key: "work4", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「空間有了樣子，故事還沒說完」· 01 全通路曝光", key: "extend_influencer", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「空間有了樣子，故事還沒說完」· 02 結構執行", key: "extend_construction", img: "800×500px", hasTag:true, hasTitle:true, hasDesc:true },
  { group: "「空間有了樣子，故事還沒說完」· 03 動線效率", key: "extend_efficiency", img: "800×500px", hasTitle:true, hasDesc:true },
  { group: "「空間有了樣子，故事還沒說完」· 04 品牌延伸", key: "extend_online", img: "800×500px", hasTitle:true, hasDesc:true },
  { group: "網站設定 · Logo", key: "logo_horizontal", img: "200×60px（電腦版橫式）" },
  { group: "網站設定 · Logo", key: "logo_round", img: "80×80px（手機版圓形）" },
  { group: "服務頁 · 快閃店設計 Banner", key: "svc_popup_banner", img: "1600×900px" },
  { group: "服務頁 · 門店輕裝修 Banner", key: "svc_store_banner", img: "1600×900px" },
  { group: "服務頁 · POSM設計製作 Banner", key: "svc_posm_banner", img: "1600×900px" },
  { group: "服務頁 · 通路識別 Banner", key: "svc_branding_banner", img: "1600×900px" },
  { group: "服務頁 · 展攤設計 Banner", key: "svc_booth_banner", img: "1600×900px" },
  { group: "服務頁 · 連鎖輔銷品管理 Banner", key: "svc_chain_banner", img: "1600×900px" },
];

function toast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3500);
}

async function ghFetch(path, opts={}){
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Authorization': `Bearer ${TOKEN}`, 'Accept': 'application/vnd.github+json', ...(opts.headers||{}) }
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`GitHub API 錯誤 (${res.status}): ${t.slice(0,200)}`);
  }
  return res.json();
}

async function doLogin(){
  const input = document.getElementById('tokenInput').value.trim();
  if(!input){ toast('請先貼上授權碼', true); return; }
  TOKEN = input;
  try{
    await ghFetch('');
    localStorage.setItem('sd_admin_token', TOKEN);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminScreen').classList.remove('hidden');
    await loadData();
  }catch(e){
    toast('授權碼無效或無法連線，請確認是否勾選了 repo 權限', true);
  }
}

async function loadData(){
  document.getElementById('statusText').textContent = '讀取中...';
  try{
    let fileData;
    try{
      fileData = await ghFetch(`/contents/content/site-data.json?ref=${BRANCH}`);
      dataSha = fileData.sha;
      siteData = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
    }catch(e){
      siteData = {};
      dataSha = null;
    }
    renderForm();
    document.getElementById('statusText').textContent = '已連線';
  }catch(e){
    toast('讀取資料失敗：' + e.message, true);
  }
}

function renderForm(){
  const area = document.getElementById('contentArea');
  area.innerHTML = '';
  let currentGroup = '';
  let groupDiv = null;

  SLOTS.forEach(slot=>{
    if(slot.group !== currentGroup){
      currentGroup = slot.group;
      const block = document.createElement('div');
      block.className = 'section-block';
      block.innerHTML = `<div class="section-header">${slot.group}</div>`;
      groupDiv = document.createElement('div');
      block.appendChild(groupDiv);
      area.appendChild(block);
    }

    const d = siteData[slot.key] || {};
    const row = document.createElement('div');
    row.className = 'item-row';

    const existingImages = d.images || [];
    const thumbsHtml = [0, 1, 2].map(i=>{
      const path = existingImages[i];
      const url = path ? `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${path}` : '';
      return `
        <div style="margin-bottom:14px;">
          <div class="thumb" id="thumb-${slot.key}-${i}">${url ? `<img src="${url}">` : ''}</div>
          <label class="upload-btn">📁 圖片 ${i+1}<input type="file" accept="image/*" onchange="handleFile(event,'${slot.key}',${i})"></label>
        </div>`;
    }).join('');

    row.innerHTML = `
      <div>
        ${thumbsHtml}
        <div class="recommend">建議尺寸：${slot.img}（最多3張，可輪播；只放1張則不會輪播）</div>
      </div>
      <div>
        ${slot.hasTag ? `<div class="field-label">標籤</div><input class="field-input" id="tag-${slot.key}" value="${(d.tag||'').replace(/"/g,'&quot;')}">` : ''}
        ${slot.hasTitle ? `<div class="field-label">標題</div><input class="field-input" id="title-${slot.key}" value="${(d.title||'').replace(/"/g,'&quot;')}">` : ''}
        ${slot.hasDesc ? `<div class="field-label">描述</div><textarea class="field-input" id="desc-${slot.key}">${d.desc||''}</textarea>` : ''}
      </div>`;
    groupDiv.appendChild(row);
  });
}

function handleFile(evt, key, idx){
  const file = evt.target.files[0];
  if(!file) return;
  pendingFiles[`${key}__${idx}`] = { key, idx, file };
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById(`thumb-${key}-${idx}`).innerHTML = `<img src="${e.target.result}"><div class="thumb-label">尚未儲存</div>`;
  };
  reader.readAsDataURL(file);
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveAll(){
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '儲存中，請稍候...';
  try{
    for(const pendKey of Object.keys(pendingFiles)){
      const { key, idx, file } = pendingFiles[pendKey];
      const ext = file.name.split('.').pop();
      const path = `images/uploads/${key}_${idx}.${ext}`;
      const base64 = await fileToBase64(file);

      let existingSha = null;
      try{
        const existing = await ghFetch(`/contents/${path}?ref=${BRANCH}`);
        existingSha = existing.sha;
      }catch(e){}

      await ghFetch(`/contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `更新圖片：${key} #${idx+1}`, content: base64, branch: BRANCH, ...(existingSha ? {sha: existingSha} : {}) })
      });

      siteData[key] = siteData[key] || {};
      siteData[key].images = siteData[key].images || [];
      siteData[key].images[idx] = path;
    }
    pendingFiles = {};

    SLOTS.forEach(slot=>{
      siteData[slot.key] = siteData[slot.key] || {};
      if(slot.hasTag) siteData[slot.key].tag = document.getElementById(`tag-${slot.key}`).value;
      if(slot.hasTitle) siteData[slot.key].title = document.getElementById(`title-${slot.key}`).value;
      if(slot.hasDesc) siteData[slot.key].desc = document.getElementById(`desc-${slot.key}`).value;
    });

    const jsonStr = JSON.stringify(siteData, null, 2);
    const jsonBase64 = btoa(unescape(encodeURIComponent(jsonStr)));

    const result = await ghFetch(`/contents/content/site-data.json`, {
      method: 'PUT',
      body: JSON.stringify({ message: '後台更新網站內容', content: jsonBase64, branch: BRANCH, ...(dataSha ? {sha: dataSha} : {}) })
    });
    dataSha = result.content.sha;

    toast('✅ 已成功儲存！網站約 1-2 分鐘後會更新');
    renderForm();
  }catch(e){
    toast('儲存失敗：' + e.message, true);
  }finally{
    btn.disabled = false;
    btn.textContent = '💾 儲存並更新網站';
  }
}

if(TOKEN){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminScreen').classList.remove('hidden');
  loadData();
}
</script>

</body>
</html>
